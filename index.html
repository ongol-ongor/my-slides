{title:'광주대단지: 도시정비와 이주',section:'사례 01 · 1971',color:'orange',message:'서울의 도시정비와 이주민의 생계가 만난 자리',body:'<div class="grid three"><div class="panel tint"><div class="label">서울시</div><h2>정비와 인구 분산</h2><p>무허가 주택 정비와 집단 이주단지 조성</p></div><div class="panel orange"><div class="label">이주민</div><h2>주거와 생계</h2><p>부족한 기반시설·일자리와 토지대금 부담</p></div><div class="panel purple"><div class="label">1971. 8. 10.</div><h2>주민들의 항의</h2><p>토지 가격과 생계 대책 요구</p></div></div><div class="small">당시 경기도 광주군 일대 · 현재 성남시 일부 · 집단별 처지와 입장은 다양함</div>',notes:'서울시는 도시정비와 인구 분산을 위해 철거민을 광주대단지로 이주시켰습니다. 그러나 주민들은 기반시설과 일자리 부족을 겪었고, 토지대금 문제까지 겹치면서 1971년 8월 10일 집단적으로 항의했습니다. 당시 이곳은 경기도 광주군이었고 현재 성남시의 일부입니다.',source:'서울기록원 https://archives.seoul.go.kr/authority/GEOL-00604 · 국가기록원 https://theme.archives.go.kr/next/monthly/viewMain.do?month=08&year=2008'},

function show(n,hash=true){index=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((el,i)=>{el.classList.toggle('active',i===index);el.setAttribute('aria-hidden',String(i!==index))});const s=slides[index];document.documentElement.style.setProperty('--accent',`var(--${s.color})`);document.querySelector('#counter').textContent=`${String(index+1).padStart(2,'0')} / ${slides.length}`;document.querySelector('#progress').style.width=`${(index+1)/slides.length*100}%`;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===slides.length-1;document.querySelector('#noteTitle').textContent=`${index+1}장 · ${s.title}`;document.querySelector('#noteText').textContent=s.notes;document.querySelector('#noteSource').textContent=s.source;document.querySelectorAll('[data-slide]').forEach(b=>b.setAttribute('aria-current',String(Number(b.dataset.slide)===index)));if(hash)history.replaceState(null,'',`#${index+1}`);document.title=`${index+1}. ${s.title} · Decisions`;}

document.querySelector('#prev').onclick=()=>show(index-1);document.querySelector('#next').onclick=()=>show(index+1);document.querySelector('#noteToggle').onclick=toggleNotes;document.querySelector('#toc').onclick=()=>tocDialog.showModal();document.querySelector('#closeToc').onclick=()=>tocDialog.close();document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{show(Number(b.dataset.slide));tocDialog.close()});document.querySelector('#print').onclick=()=>window.print();document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else document.querySelector('#status').textContent='이 브라우저는 전체화면을 지원하지 않습니다.'}catch{document.querySelector('#status').textContent='전체화면을 사용할 수 없습니다.'}};document.addEventListener('fullscreenchange',()=>document.querySelector('#full').textContent=document.fullscreenElement?'전체화면 종료':'전체화면');document.addEventListener('keydown',e=>{if(tocDialog.open||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(e.key))e.preventDefault();if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='m')tocDialog.showModal()});let touch=null;deck.addEventListener('touchstart',e=>{touch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}}, {passive:true});deck.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)show(index+(dx<0?1:-1));touch=null},{passive:true});window.addEventListener('hashchange',fromHash);fromHash();

let currentStep=0;const stepTabs=[...document.querySelectorAll('[data-step]')];
function selectStep(n,focus=false){currentStep=Math.max(0,Math.min(3,n));stepTabs.forEach((b,i)=>{b.setAttribute('aria-selected',String(i===currentStep));b.tabIndex=i===currentStep?0:-1;document.querySelector('#step-detail-'+i).hidden=i!==currentStep});document.querySelector('#step-back').disabled=currentStep===0;document.querySelector('#step-forward').disabled=currentStep===3;document.querySelector('#step-status').textContent=`${currentStep+1} / 4 · 단계 버튼을 눌러 전환`;if(focus)stepTabs[currentStep].focus()}
deck.addEventListener('click',e=>{const tab=e.target.closest('[data-step]');if(tab){selectStep(Number(tab.dataset.step));return}if(e.target.closest('#step-back'))selectStep(currentStep-1);if(e.target.closest('#step-forward'))selectStep(currentStep+1)});
stepTabs.forEach(b=>{b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();selectStep(e.key==='Home'?0:e.key==='End'?3:currentStep+(e.key==='ArrowRight'?1:-1),true)}}});selectStep(0);
